<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: the app draws under the iPhone status bar and home indicator itself (safe areas) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <!-- Website on a phone: draw the whole page ~12% smaller. initial-scale < 1 with width=device-width
         makes the browser widen the layout viewport to device-width / 0.88 (Chrome and Safari), so the
         page fills the screen at any orientation. Tablets and computers (shorter side >= 600) unchanged.
         src/webIOS.ts and src/webScale.ts read window.__kosScale. "?fullscale" skips it (for comparing). -->
    <script>
      (function () {
        try {
          if (Math.min(screen.width, screen.height) >= 600 || /[?&]fullscale\b/.test(location.search)) return;
          var k = 0.88;
          var m = document.querySelector('meta[name="viewport"]');
          m.setAttribute("content", "width=device-width, initial-scale=" + k + ", shrink-to-fit=no, viewport-fit=cover");
          window.__kosScale = k;
        } catch (e) {}
      })();
    </script>
    <title>%WEB_TITLE%</title>
    <!-- Added to the iPhone / Android home screen: opens as an app, without the browser's address and tool bars -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Косметичка" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#170D25" />
    <link rel="manifest" href="/assets/pwa/site.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/pwa/icon-180.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
