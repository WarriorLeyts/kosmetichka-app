<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: the app draws under the iPhone status bar and home indicator itself (safe areas) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <!-- Website on a phone: draw the whole page ~20% smaller. initial-scale < 1 with width=device-width
         makes the browser widen the layout viewport to device-width / 0.8 (Chrome and Safari), so the
         page fills the screen at any orientation. Tablets and computers (shorter side >= 600) unchanged.
         src/webIOS.ts and src/webScale.ts read window.__kosScale. "?fullscale" skips it (for comparing). -->
    <script>
      (function () {
        try {
          if (Math.min(screen.width, screen.height) >= 600 || /[?&]fullscale\b/.test(location.search)) return;
          var k = 0.8;
          var m = document.querySelector('meta[name="viewport"]');
          m.setAttribute("content", "width=device-width, initial-scale=" + k + ", shrink-to-fit=no, viewport-fit=cover");
          window.__kosScale = k;
          // react-native-web sizes the app by visualViewport.width * scale (the screen width); report
          // the page scale relative to ours so it gets the wider layout width
          var vv = window.visualViewport;
          if (vv) {
            var w = {
              addEventListener: vv.addEventListener.bind(vv),
              removeEventListener: vv.removeEventListener.bind(vv),
            };
            ["width", "height", "offsetLeft", "offsetTop", "pageLeft", "pageTop"].forEach(function (n) {
              Object.defineProperty(w, n, { get: function () { return vv[n]; } });
            });
            Object.defineProperty(w, "scale", { get: function () { return vv.scale / k; } });
            Object.defineProperty(window, "visualViewport", { configurable: true, get: function () { return w; } });
          }
        } catch (e) {}
      })();
    </script>
    <!-- iPhone, opened from the home screen (black-translucent status bar): iOS makes the page shorter than
         the screen by the status bar's height, so an empty strip was left at the bottom. The page is
         given the whole screen height (in page pixels: ÷ the phone-site scale). -->
    <script>
      (function () {
        try {
          var n = navigator;
          var standalone = n.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
          if (!/iPhone|iPod/.test(n.userAgent) || !standalone) return;
          var k = window.__kosScale || 1;
          var fit = function () {
            var portrait = !window.matchMedia || matchMedia("(orientation: portrait)").matches;
            var h = (portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height)) / k;
            h = Math.max(h, window.innerHeight || 0);
            document.documentElement.style.height = h + "px";
            if (document.body) document.body.style.height = h + "px";
          };
          fit();
          document.addEventListener("DOMContentLoaded", fit);
          window.addEventListener("resize", fit);
          window.addEventListener("orientationchange", function () { setTimeout(fit, 300); });
        } catch (e) {}
      })();
    </script>
    <title>%WEB_TITLE%</title>
    <!-- Added to the iPhone / Android home screen: opens as an app, without the browser's address and tool bars -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Косметичка" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#170D25" />
    <link rel="manifest" href="/assets/pwa/site.webmanifest" />
    <!-- tab icon: the brand logo (not Expo's default) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/pwa/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/pwa/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/pwa/favicon-192.png" />
    <link rel="apple-touch-icon" href="/assets/pwa/icon-180.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
