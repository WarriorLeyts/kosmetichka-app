<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Косметичка — предпросмотр заказа</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#faf5ff;color:#20112d}header{padding:14px 18px;background:#fff;border-bottom:1px solid #eadff4;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{font-size:17px;margin:0 0 4px;font-weight:750}p{font-size:12px;color:#756381;margin:0;line-height:1.4}.controls{display:flex;gap:7px;flex-wrap:wrap}button{font:inherit;border:1px solid #e5d6f3;border-radius:12px;background:white;color:#7431b7;font-size:13px;font-weight:650;padding:11px 13px;min-height:44px;cursor:pointer}button[aria-pressed=true]{background:#8b3dff;color:#fff;border-color:#8b3dff}iframe{border:0;width:100%;display:block;height:calc(100dvh - 95px);min-height:650px;background:#faf5ff}.hint{padding:9px 18px;background:#f3e8ff;font-size:12px;color:#654577}@media(max-width:700px){header{gap:9px;padding:12px}iframe{height:calc(100dvh - 176px);min-height:650px}.hint{padding:9px 12px}.controls{width:100%}}
</style></head><body>
<header><div><h1>Предпросмотр на вашем сайте</h1><p>Реальные заказы не меняются. Срок в час — пример.</p></div><div class="controls"><button id="client" aria-label="Экран клиента" aria-pressed="true">Клиент</button><button id="manager" aria-label="Экран менеджера" aria-pressed="false">Менеджер</button><button id="reset">Сбросить</button></div></header>
<div class="hint" id="hint">Так клиент увидит подтверждение получения заказа. Переключитесь на менеджера и нажмите «Взять заказ в работу».</div>
<iframe id="preview" title="Настоящий интерфейс сайта Косметичка с примером заказа" referrerpolicy="no-referrer" src="/assets/order-service-preview-v1/customer/order/1248/"></iframe>
<script>
(()=>{const root='/assets/order-service-preview-v1',frame=document.getElementById('preview');let role='client';function show(next){role=next;document.getElementById('client').setAttribute('aria-pressed',String(role==='client'));document.getElementById('manager').setAttribute('aria-pressed',String(role==='manager'));document.getElementById('hint').textContent=role==='manager'?'Возьмите заказ в работу. В разделе «Чат с клиентом» попробуйте быстрые ответы — текст можно изменить перед отправкой.':'Так клиент увидит статус заказа и сообщения в своём чате.';frame.src=root+'/'+(role==='manager'?'team':'customer')+'/order/1248/?view='+Date.now();}document.getElementById('client').onclick=()=>show('client');document.getElementById('manager').onclick=()=>show('manager');document.getElementById('reset').onclick=()=>{Object.keys(localStorage).filter(k=>k.startsWith('kosmetichka-order-service-preview-v1:')).forEach(k=>localStorage.removeItem(k));show('client');};})();
</script></body></html>
