name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SMARTCAPTCHA_CLIENT_KEY: ${{ vars.SMARTCAPTCHA_CLIENT_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: scripts/ci-run.sh npm install --no-audit --no-fund

      - name: Type check (all errors at once)
        run: scripts/ci-run.sh npx tsc --noEmit --pretty false

      - name: Build web + Android project
        run: scripts/ci-run.sh scripts/prepare-native.sh android

      - name: Build APK
        working-directory: android
        run: ../scripts/ci-run.sh ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kosmetichka-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish APK to the "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk kosmetichka.apk
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease --title "Android — тестовая сборка" \
              --notes "Последняя тестовая сборка для Android. Скачайте kosmetichka.apk на телефон и установите."
          gh release upload android-latest kosmetichka.apk --clobber
          gh release edit android-latest --notes "Сборка 1.0.${GITHUB_RUN_NUMBER} от $(date -u +'%d.%m.%Y %H:%M') UTC. Скачайте kosmetichka.apk на телефон и установите."
