name: Checks (types, lint, tests)

# Every push / PR: TypeScript, ESLint and unit tests of both apps (audit ARCH-05).
# Fast — no native builds; those stay in native.yml / team.yml.
on:
  push:
    branches: [main]
    paths: ["native/**", "team/**", ".github/workflows/checks.yml"]
  pull_request:
    paths: ["native/**", "team/**", ".github/workflows/checks.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [native, team]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: ../scripts/ci-run.sh npm run deps
      - name: Types
        run: ../scripts/ci-run.sh npx tsc --noEmit
      - name: Lint
        run: ../scripts/ci-run.sh npm run lint
      - name: Unit tests
        if: matrix.app == 'native'
        run: ../scripts/ci-run.sh npm test
