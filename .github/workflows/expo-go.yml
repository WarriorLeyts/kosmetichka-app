name: Expo Go (iPhone)

# Publishes the app's JS to Expo (EAS Update) so it opens in Expo Go on iPhone/Android
# from a permanent QR code — no computer needed. Requires the EXPO_TOKEN secret.

# Автозапуск выключен: Expo Go больше не используется. Только вручную.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Канал (main — основной QR-код)"
        default: main
      disable:
        description: "Отладка: выключить (blur,mask)"
        default: ""

permissions:
  contents: write

defaults:
  run:
    working-directory: native

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CHANNEL: ${{ inputs.channel || 'main' }}
      EXPO_PUBLIC_DISABLE: ${{ inputs.disable || '' }}
    steps:
      - name: Check token
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning title=Expo Go::Добавьте секрет EXPO_TOKEN (токен с expo.dev) — тогда приложение опубликуется для Expo Go."
            exit 0
          fi
          echo "HAS_TOKEN=1" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == '1'
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == '1'
        with:
          node-version: 22
      # Expo Go from the App Store only runs the newest SDK — move this publish to it
      # (the Android APK keeps its own SDK from package.json)
      - name: Use the SDK of the current Expo Go
        if: env.HAS_TOKEN == '1'
        run: npm pkg set dependencies.expo=~58.0.0
      - name: Install
        if: env.HAS_TOKEN == '1'
        run: ../scripts/ci-run.sh npm run deps
      - name: Resolved versions
        if: env.HAS_TOKEN == '1'
        run: |
          v=$(node -e 'const n=["expo","react","react-native","expo-router","react-native-screens","react-native-safe-area-context","expo-blur","@react-navigation/bottom-tabs","@react-navigation/native","react-native-gesture-handler"];console.log(n.map(x=>{try{return x+"@"+require(x+"/package.json").version}catch{return x+"@-"}}).join("%0A"))')
          echo "::notice title=Versions::${v}"
      - name: Check types on the new SDK
        if: env.HAS_TOKEN == '1'
        continue-on-error: true
        run: ../scripts/ci-run.sh npx tsc --noEmit --pretty false
      - name: Add expo-updates (only for this publish, not for the APK)
        if: env.HAS_TOKEN == '1'
        run: ../scripts/ci-run.sh npx expo install expo-updates -- --legacy-peer-deps
      - name: Link Expo project
        if: env.HAS_TOKEN == '1'
        run: ../scripts/ci-run.sh npx -y eas-cli@latest init --non-interactive --force
      - name: Configure updates for Expo Go (runtime = SDK version)
        if: env.HAS_TOKEN == '1'
        run: |
          node -e '
            const fs=require("fs");const a=JSON.parse(fs.readFileSync("app.json","utf8"));
            const id=a.expo.extra&&a.expo.extra.eas&&a.expo.extra.eas.projectId;
            if(!id) throw new Error("no projectId after eas init");
            a.expo.runtimeVersion={policy:"sdkVersion"};
            a.expo.updates={url:"https://u.expo.dev/"+id};
            fs.writeFileSync("app.json",JSON.stringify(a,null,2));
            fs.appendFileSync(process.env.GITHUB_ENV,"PROJECT_ID="+id+"\n");'
          npx -y eas-cli@latest channel:create $CHANNEL --non-interactive || true
      - name: Publish update
        if: env.HAS_TOKEN == '1'
        run: ../scripts/ci-run.sh npx -y eas-cli@latest update --channel $CHANNEL --message "${{ github.event.head_commit.message || 'manual' }}" --non-interactive
      - name: Link and QR code
        if: env.HAS_TOKEN == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SDK=$(node -p 'require("expo/package.json").version.split(".")[0]')
          Q="projectId=${PROJECT_ID}&runtimeVersion=exposdk:${SDK}.0.0&channel=${CHANNEL}&slug=exp"
          URL=$(curl -fsS "https://qr.expo.dev/eas-update?${Q}&format=url" || echo "")
          QR="https://qr.expo.dev/eas-update?${Q}"
          BODY=$(printf '## Открыть в Expo Go\n\n1. Установите **Expo Go** из App Store.\n2. Наведите камеру iPhone на QR-код:\n\n![QR](%s)\n\nСсылка: %s\n\nQR-код постоянный — после каждого изменения приложение в Expo Go обновляется само (перезапустите его).\n' "$QR" "$URL")
          echo "$BODY" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Expo Go::${URL}"
          if [ "$CHANNEL" != "main" ]; then exit 0; fi
          if gh release view expo-go >/dev/null 2>&1; then
            gh release edit expo-go --notes "$BODY"
          else
            gh release create expo-go --title "Expo Go (iPhone)" --notes "$BODY" --latest=false
          fi
