name: iOS

# Without Apple secrets: builds the app for the iOS Simulator (checks that everything compiles).
# With the secrets below set in Settings → Secrets and variables → Actions:
# signs the app and uploads it to TestFlight.
#   APPLE_TEAM_ID            — Team ID from developer.apple.com → Membership
#   APPSTORE_API_KEY_ID      — App Store Connect → Users and Access → Integrations → Keys
#   APPSTORE_API_ISSUER_ID   — same page, "Issuer ID"
#   APPSTORE_API_KEY_P8      — contents of the downloaded AuthKey_XXXX.p8 file

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

jobs:
  ios:
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.APPSTORE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: scripts/ci-run.sh npm install --no-audit --no-fund

      - name: Build web + iOS project
        run: scripts/ci-run.sh scripts/prepare-native.sh ios

      - name: Locate Xcode project
        id: proj
        run: |
          if [ -d ios/App/App.xcworkspace ]; then
            echo "args=-workspace ios/App/App.xcworkspace" >> "$GITHUB_OUTPUT"
          else
            echo "args=-project ios/App/App.xcodeproj" >> "$GITHUB_OUTPUT"
          fi

      - name: Build for Simulator (no Apple account needed)
        if: env.HAS_SIGNING != 'true'
        run: |
          set -o pipefail
          scripts/ci-run.sh xcodebuild ${{ steps.proj.outputs.args }} -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build -quiet

      - name: Archive and upload to TestFlight
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          set -o pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          printf '%s' "$KEY_P8" > "$KEY_PATH"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY_PATH -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID"

          xcodebuild ${{ steps.proj.outputs.args }} -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            $AUTH archive | tail -40

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" $AUTH
