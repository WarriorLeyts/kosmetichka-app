name: Input check

# Types into the login / register / search fields on an Android emulator and an iPhone simulator.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "android / ios / both"
        default: both

permissions:
  contents: write

jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build x86_64 APK (blur and gradient text off — the CI emulator has no GPU)
        working-directory: native
        env:
          EXPO_PUBLIC_DISABLE: "blur,mask"
        run: |
          ../scripts/ci-run.sh npm run deps
          ../scripts/ci-run.sh npx expo prebuild --platform android --no-install
          cd android && ../../scripts/ci-run.sh ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
          cp app/build/outputs/apk/release/app-release.apk ../../app.apk
      - name: Run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          script: bash scripts/emu-input.sh
      - name: Upload
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app-check >/dev/null 2>&1 || gh release create app-check --title "App check" --notes "screenshots" --latest=false
          for f in shots/*; do [ -s "$f" ] && gh release upload app-check "$f" --clobber || true; done

  ios:
    if: inputs.platform != 'android'
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: ../scripts/ci-run.sh npm run deps
      - name: Generate iOS project
        run: ../scripts/ci-run.sh npx expo prebuild --platform ios
      - name: Build for simulator
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1); SCHEME=$(basename "$WS" .xcworkspace)
          ../scripts/ci-run.sh xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Run
        run: |
          mkdir -p shots
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone 16") or x["name"].startswith("iPhone 15")];print(c[0]["udid"])')
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Release-iphonesimulator/*.app | head -1)"
          xcrun simctl spawn "$UDID" log stream --level debug --style compact --predicate 'subsystem == "com.facebook.react.log"' > shots/ios-input-log.txt 2>&1 &
          xcrun simctl launch "$UDID" ru.kosmetichkaopt.app
          sleep 20
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          cat > flow.yaml <<'YAML'
          appId: ru.kosmetichkaopt.app
          ---
          - tapOn: { text: "Профиль", optional: true }
          - tapOn: { text: "Войти", optional: true }
          - waitForAnimationToEnd
          - takeScreenshot: ios-in-1-login
          - tapOn: { text: "Телефон или email", optional: true }
          - inputText: "89990001122"
          - takeScreenshot: ios-in-2-login-typed
          - tapOn: { text: "Пароль", index: 1, optional: true }
          - inputText: "secret12"
          - takeScreenshot: ios-in-3-pass-typed
          - assertVisible: { text: "89990001122", optional: true }
          YAML
          sed -i '' 's/^          //' flow.yaml
          perl -e 'alarm shift; exec @ARGV' 600 maestro --device "$UDID" test --test-output-dir "$PWD/shots/m" flow.yaml > shots/ios-input-maestro.txt 2>&1 || true
          find shots/m -name "*.png" -exec cp {} shots/ \; ; rm -rf shots/m
          grep -iE "error|warn" shots/ios-input-log.txt | cut -c1-250 | tail -30 >> shots/ios-input-maestro.txt || true
          msg=$(sed 's/%/%25/g' shots/ios-input-maestro.txt | cut -c1-200 | tail -40 | awk '{printf "%s%%0A", $0}')
          echo "::notice title=iOS input::${msg}"
      - name: Upload
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app-check >/dev/null 2>&1 || gh release create app-check --title "App check" --notes "screenshots" --latest=false
          for f in shots/*; do [ -s "$f" ] && gh release upload app-check "$f" --clobber || true; done
