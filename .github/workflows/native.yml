name: Native app

# Полноценное нативное приложение (React Native / Expo) из папки native/.
# Android: собирает APK и выкладывает в релиз "native-android-latest".
# iOS: без секретов Apple — проверочная сборка под симулятор; с секретами — TestFlight
#      (список секретов — в начале .github/workflows/ios.yml).

on:
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: native

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (versions matched to the Expo SDK)
        run: ../scripts/ci-run.sh npm run deps
      - name: Type check
        run: ../scripts/ci-run.sh npx tsc --noEmit --pretty false
      - name: Bundle JS (catches import errors)
        run: ../scripts/ci-run.sh npx expo export --platform android --output-dir dist
      - name: Resolved dependency versions
        run: |
          deps=$(node -e 'const p=require("./package.json");console.log(Object.entries({...p.dependencies,...p.devDependencies}).map(([k,v])=>k+"@"+v).join("%0A"))')
          echo "::notice title=Dependencies::${deps}"

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: ../scripts/ci-run.sh npm run deps
      - name: Generate Android project
        run: ../scripts/ci-run.sh npx expo prebuild --platform android --no-install
      - name: Version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]+\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle
      - name: Build APK
        working-directory: native/android
        run: ../../scripts/ci-run.sh ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk kosmetichka-native.apk
          gh release view native-android-latest >/dev/null 2>&1 || \
            gh release create native-android-latest --prerelease --title "Нативное приложение — Android" \
              --notes "Тестовая сборка нативного приложения."
          gh release upload native-android-latest kosmetichka-native.apk --clobber
          gh release edit native-android-latest --notes "Нативное приложение, сборка 1.0.${GITHUB_RUN_NUMBER} от $(date -u +'%d.%m.%Y %H:%M') UTC. Скачайте kosmetichka-native.apk на телефон и установите."

  ios:
    needs: check
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.APPSTORE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: ../scripts/ci-run.sh npm run deps
      - name: Generate iOS project
        run: ../scripts/ci-run.sh npx expo prebuild --platform ios
      - name: Version
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.${GITHUB_RUN_NUMBER}" ios/*/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" ios/*/Info.plist
      - name: Build for Simulator (no Apple account needed)
        if: env.HAS_SIGNING != 'true'
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1); SCHEME=$(basename "$WS" .xcworkspace)
          ../scripts/ci-run.sh xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Archive and upload to TestFlight
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1); SCHEME=$(basename "$WS" .xcworkspace)
          KEY_PATH="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          printf '%s' "$KEY_P8" > "$KEY_PATH"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY_PATH -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID"
          ../scripts/ci-run.sh xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic $AUTH archive -quiet
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          ../scripts/ci-run.sh xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" $AUTH
