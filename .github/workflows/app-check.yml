name: App check (Android APK + iOS)

# Runs the real app on an Android emulator (the published APK) and on an iPhone simulator
# (Release build from the same source as the .ipa), walks through all screens in light and
# dark theme, saves screenshots and error logs to the release "app-check".
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "android / ios / both"
        default: both

permissions:
  contents: write

jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      # the published APK is ARM-only (phones); the CI emulator is x86_64, so build the same code for x86_64
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK for the emulator (same code, x86_64)
        working-directory: native
        run: |
          ../scripts/ci-run.sh npm run deps
          ../scripts/ci-run.sh npx expo prebuild --platform android --no-install
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError/' android/gradle.properties && grep jvmargs android/gradle.properties
          cd android && ../../scripts/ci-run.sh ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
          cp app/build/outputs/apk/release/app-release.apk ../../app.apk
      - name: Run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          script: bash scripts/emu-check.sh
      - name: Upload
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app-check >/dev/null 2>&1 || gh release create app-check --title "App check" --notes "screenshots" --latest=false
          for f in shots/*; do mv "$f" "shots/android-$(basename "$f")"; done
          gh release upload app-check shots/* --clobber

  ios:
    if: inputs.platform != 'android'
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: ../scripts/ci-run.sh npm run deps
      - name: Generate iOS project
        run: ../scripts/ci-run.sh npx expo prebuild --platform ios
      - name: Build for simulator (Release, same code as the .ipa)
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1); SCHEME=$(basename "$WS" .xcworkspace)
          ../scripts/ci-run.sh xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Run on simulator
        run: |
          mkdir -p shots
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone 16") or x["name"].startswith("iPhone 15")];print(c[0]["udid"])')
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Release-iphonesimulator/*.app | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant all ru.kosmetichkaopt.app || true
          xcrun simctl spawn "$UDID" log stream --level debug --style compact --predicate 'subsystem == "com.facebook.react.log" OR eventMessage CONTAINS[c] "exception" OR eventMessage CONTAINS[c] "crash"' > shots/log.txt 2>&1 &
          echo $! > ../logpid
          xcrun simctl launch "$UDID" ru.kosmetichkaopt.app
          sleep 6;  xcrun simctl io "$UDID" screenshot shots/01-home-scene-start.png
          sleep 8;  xcrun simctl io "$UDID" screenshot shots/02-home-scene-middle.png
          sleep 12; xcrun simctl io "$UDID" screenshot shots/03-home-scene-end.png
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          cat > flow.yaml <<'YAML'
          appId: ru.kosmetichkaopt.app
          ---
          - tapOn: { text: "Каталог", optional: true }
          - waitForAnimationToEnd
          - takeScreenshot: 10-light-catalog
          - tapOn: { point: "26%,75%", optional: true }
          - waitForAnimationToEnd
          - takeScreenshot: 10-qty-a-added
          - tapOn: { point: "24%,75%", optional: true }
          - tapOn: { point: "24%,75%", optional: true }
          - takeScreenshot: 10-qty-b-plus
          - tapOn: { point: "11%,75%", optional: true }
          - takeScreenshot: 10-qty-c-minus
          - tapOn: { text: "Все категории", optional: true }
          - waitForAnimationToEnd
          - takeScreenshot: 10-types-0-drawer
          - tapOn: { text: "Уход па телом", optional: true }
          - waitForAnimationToEnd
          - tapOn: { text: "Мисты и спреи для тела", optional: true }
          - waitForAnimationToEnd
          - takeScreenshot: 10-types-a-sub
          - tapOn: { text: "Мисты", optional: true }
          - waitForAnimationToEnd
          - takeScreenshot: 10-types-b-mists
          - tapOn: { point: "27%,50%", optional: true }
          - waitForAnimationToEnd
          - takeScreenshot: 11-light-product
          - tapOn: { text: "Назад", optional: true }
          - waitForAnimationToEnd
          - tapOn: { text: "Корзина", optional: true }
          - takeScreenshot: 12-light-cart
          - tapOn: { text: "Заказы", optional: true }
          - takeScreenshot: 13-light-orders
          - tapOn: { text: "Профиль", optional: true }
          - takeScreenshot: 14-light-profile
          - tapOn: { text: "Избранное", optional: true }
          - waitForAnimationToEnd
          - takeScreenshot: 15-light-favorites
          - tapOn: { text: "Назад", optional: true }
          - waitForAnimationToEnd
          - tapOn: { text: "Главная", optional: true }
          - tapOn: { text: "Тёмная тема", optional: true }
          - waitForAnimationToEnd
          - takeScreenshot: 20-dark-home
          - tapOn: { text: "Каталог", optional: true }
          - waitForAnimationToEnd
          - takeScreenshot: 21-dark-catalog
          - tapOn: { point: "26%,75%", optional: true }
          - waitForAnimationToEnd
          - takeScreenshot: 21-qty-a-added
          - tapOn: { point: "24%,75%", optional: true }
          - tapOn: { point: "24%,75%", optional: true }
          - takeScreenshot: 21-qty-b-plus
          - tapOn: { point: "11%,75%", optional: true }
          - takeScreenshot: 21-qty-c-minus
          - tapOn: { point: "27%,50%", optional: true }
          - waitForAnimationToEnd
          - takeScreenshot: 22-dark-product
          - tapOn: { text: "Назад", optional: true }
          - waitForAnimationToEnd
          - tapOn: { text: "Корзина", optional: true }
          - takeScreenshot: 23-dark-cart
          - tapOn: { text: "Заказы", optional: true }
          - takeScreenshot: 24-dark-orders
          - tapOn: { text: "Профиль", optional: true }
          - takeScreenshot: 25-dark-profile
          - tapOn: { text: "Главная", optional: true }
          - tapOn: { text: "Светлая тема", optional: true }
          - tapOn: { text: "Поиск: название, бренд, артикул", optional: true }
          - waitForAnimationToEnd
          - takeScreenshot: 30-search
          - tapOn: { text: "Главная", optional: true }
          - tapOn: { text: "Перейти в каталог", optional: true }
          - waitForAnimationToEnd
          - takeScreenshot: 31-cta-catalog
          YAML
          sed -i '' 's/^          //' flow.yaml
          perl -e 'alarm shift; exec @ARGV' 900 maestro --device "$UDID" test --test-output-dir "$PWD/shots/m" flow.yaml > shots/maestro.txt 2>&1 || echo "maestro ended with an error / timeout" >> shots/maestro.txt
          xcrun simctl io "$UDID" screenshot shots/99-last.png
          xcrun simctl spawn "$UDID" launchctl list | grep -q kosmetichkaopt || echo "app process not running at the end" >> shots/maestro.txt
          xcrun simctl spawn "$UDID" defaults read com.apple.Accessibility ReduceMotionEnabled >> shots/maestro.txt 2>&1 || true
      - name: Logs
        if: always()
        run: |
          kill $(cat ../logpid) 2>/dev/null || true
          grep -iE "error|exception|warn|unhandled|crash" shots/log.txt | cut -c1-300 | sort | uniq -c | sort -rn | head -60 > shots/errors.txt || true
          msg=$( (tail -15 shots/maestro.txt; cat shots/errors.txt) | sed 's/%/%25/g' | cut -c1-230 | head -60 | awk '{printf "%s%%0A", $0}')
          echo "::notice title=iOS check::${msg}"
      - name: Upload
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app-check >/dev/null 2>&1 || gh release create app-check --title "App check" --notes "screenshots" --latest=false
          find shots/m -name "*.png" -exec cp {} shots/ \; 2>/dev/null || true
          rm -rf shots/m
          for f in shots/*; do mv "$f" "shots/ios-$(basename "$f")"; done
          for f in shots/*; do [ -s "$f" ] && gh release upload app-check "$f" --clobber || true; done
