name: Android emulator check

# Installs the latest published APK on an Android emulator, scrolls the home screen
# step by step and saves screenshots (for checking the home scene).
on:
  workflow_dispatch:
    inputs:
      device:
        description: "Размер экрана (ширина x высота в dp)"
        default: "390x844"

permissions:
  contents: write

jobs:
  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download native-android-latest -R ${{ github.repository }} -p '*.apk' -O app.apk
      - name: Run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: false
          script: |
            mkdir -p shots
            adb install -r app.apk
            adb logcat -c
            adb shell am start -n ru.kosmetichkaopt.app/.MainActivity
            sleep 30
            adb exec-out screencap -p > shots/00-start.png
            SIZE=$(adb shell wm size | tail -1 | awk '{print $3}'); W=${SIZE%x*}; H=${SIZE#*x}
            echo "screen $W x $H"
            X=$((W/2)); Y1=$((H*70/100)); Y2=$((H*45/100))
            for i in $(seq -w 1 14); do adb shell input swipe $X $Y1 $X $Y2 900; sleep 2; adb exec-out screencap -p > shots/$i-down.png; done
            for i in 1 2 3 4; do adb shell input swipe $X $Y2 $X $Y1 900; sleep 2; adb exec-out screencap -p > shots/up-$i.png; done
            adb shell input tap $((W*32/100)) $((H*95/100)); sleep 4; adb exec-out screencap -p > shots/zz-tap-catalog.png
            adb logcat -d -s AndroidRuntime:E ReactNativeJS:V ReactNative:E | tail -60 > shots/logcat.txt || true
            msg=$(sed 's/%/%25/g' shots/logcat.txt | cut -c1-220 | tail -30 | awk '{printf "%s%%0A", $0}')
            echo "::notice title=logcat::${msg}"
      - name: Upload screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-emu-debug -R ${{ github.repository }} >/dev/null 2>&1 || gh release create android-emu-debug -R ${{ github.repository }} --title "Android emulator debug" --notes "debug" --latest=false
          for f in $(gh release view android-emu-debug -R ${{ github.repository }} --json assets -q '.assets[].name'); do gh release delete-asset android-emu-debug "$f" -R ${{ github.repository }} -y || true; done
          gh release upload android-emu-debug shots/*.png shots/logcat.txt -R ${{ github.repository }} --clobber
